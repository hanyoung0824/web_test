name: Build and push images

on:
  push:
    branches: [main]        # main에 push될 때마다 실행

permissions:
  contents: read            # 코드 읽기
  packages: write           # GHCR에 이미지 올리기

jobs:
  build:
    runs-on: ubuntu-latest  # GitHub이 제공하는 Linux 서버에서 실행
    steps:
      - uses: actions/checkout@v5   # 리포 코드 받기

      - uses: docker/login-action@v3  # GHCR 로그인
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6  # backend 이미지
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/hanyoung0824/webtest-backend:latest
            ghcr.io/hanyoung0824/webtest-backend:${{ github.sha }}

      - uses: docker/build-push-action@v6  # nginx 이미지
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/hanyoung0824/webtest-nginx:latest
            ghcr.io/hanyoung0824/webtest-nginx:${{ github.sha }}